[tool.poetry]
name = "slava"
version = "0.1.0"
description = "SLAVA: Benchmark of Sociopolitical Landscape and Value Analysis"
authors = ["Rinat Sharafetdinov <rinat.sharafetdinov42@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = ">=2.0,<3.0"
pandas = "^2.2.2"
fuzzywuzzy = "^0.18.0"
huggingface-hub = ">=1.0,<2.0"
langchain = "^0.3.0"
langchain-huggingface = "^0.1.0"
langchain-ollama = "^0.2.0"
langchain-community = "^0.3.0"
openpyxl = "^3.1.5"
gigachat = "^0.1.35"
google-generativeai = "^0.8.3"
openai = ">=2.0,<3.0"
anthropic = ">=0.71,<1.0"
pymongo = "^4.15.3"
matplotlib = "^3.10.7"
tiktoken = "^0.13.0"
slava-shuffle-pipeline = { path = "code/SLAVA/slava_shuffle_pipeline", develop = true }
transformers = "5.12.1"
sentence-transformers = ">=5.3,<6"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
ipykernel = "^6.29.5"
pytest = ">=8,<10"

# GPU inference is opt-in so the regular SLAVA environment remains usable on
# machines without CUDA. Install it with: poetry install --with vllm
[tool.poetry.group.vllm]
optional = true

[tool.poetry.group.vllm.dependencies]
vllm = "0.24.0"
mistral-common = ">=1.6.2"
packaging = ">=24"
# 0.2.5 is published without CPython 3.11-3.13 wheels; vLLM accepts >=0.1.32.
xgrammar = "0.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
